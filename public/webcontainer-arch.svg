<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00000055"/>
    </filter>
    <style>
      .title { font: 700 36px 'Inter', system-ui, -apple-system, Segoe UI, Roboto; fill: #111827; }
      .subtitle { font: 500 22px 'Inter', system-ui; fill: #6B7280; }
      .label { font: 600 18px 'Inter', system-ui; fill: #111827; }
      .small { font: 500 16px 'Inter', system-ui; fill: #374151; }
      .mono { font: 600 16px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; fill: #111827; }
      .cap { font: 500 14px 'Inter', system-ui; fill: #6B7280; }
      .chip { font: 600 14px 'Inter', system-ui; fill: #065F46; }
    </style>
  </defs>

  <!-- Page background -->
  <rect x="0" y="0" width="1400" height="900" fill="#F9FAFB"/>

  <!-- Title -->
  <text x="70" y="90" class="title">Everything happens inside the browser</text>
  <text x="70" y="130" class="subtitle">Browser → WebAssembly (WASM) → Node.js Runtime → npm / Vite → App Preview</text>

  <!-- Browser window -->
  <g filter="url(#shadow)">
    <rect x="70" y="170" rx="18" ry="18" width="1260" height="650" fill="#FFFFFF" stroke="#E5E7EB"/>
    <!-- Browser chrome -->
    <rect x="70" y="170" rx="18" ry="18" width="1260" height="56" fill="#F3F4F6" stroke="#E5E7EB"/>
    <circle cx="105" cy="198" r="8" fill="#EF4444"/>
    <circle cx="130" cy="198" r="8" fill="#F59E0B"/>
    <circle cx="155" cy="198" r="8" fill="#10B981"/>
    <rect x="200" y="186" rx="10" ry="10" width="1080" height="24" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="214" y="203" class="cap">localhost — browser sandbox</text>
  </g>

  <!-- WASM layer -->
  <g>
    <rect x="110" y="260" rx="14" ry="14" width="1180" height="520" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="130" y="295" class="label">WebAssembly (WASM) sandbox</text>
    <text x="130" y="322" class="cap">Provides low-level building blocks (memory, syscalls, isolation)</text>
  </g>

  <!-- Node.js runtime block -->
  <g filter="url(#shadow)">
    <rect x="160" y="340" rx="14" ry="14" width="820" height="370" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="180" y="375" class="label">WebContainer Runtime (Node.js inside the browser)</text>
    <rect x="180" y="395" rx="10" ry="10" width="240" height="60" fill="#FFFFFF" stroke="#D1FAE5"/>
    <text x="200" y="430" class="mono">node / process</text>

    <rect x="440" y="395" rx="10" ry="10" width="240" height="60" fill="#FFFFFF" stroke="#D1FAE5"/>
    <text x="460" y="430" class="mono">virtual filesystem</text>

    <rect x="700" y="395" rx="10" ry="10" width="260" height="60" fill="#FFFFFF" stroke="#D1FAE5"/>
    <text x="720" y="430" class="mono">network & ports</text>

    <rect x="180" y="475" rx="10" ry="10" width="240" height="90" fill="#FFFFFF" stroke="#D1FAE5"/>
    <text x="200" y="510" class="mono">npm install</text>
    <text x="200" y="535" class="cap">dependency resolution in-browser</text>

    <rect x="440" y="475" rx="10" ry="10" width="240" height="90" fill="#FFFFFF" stroke="#D1FAE5"/>
    <text x="460" y="510" class="mono">Vite dev server</text>
    <text x="460" y="535" class="cap">HMR, build, preview</text>

    <rect x="700" y="475" rx="10" ry="10" width="260" height="90" fill="#FFFFFF" stroke="#D1FAE5"/>
    <text x="720" y="510" class="mono">shell / terminal</text>
    <text x="720" y="535" class="cap">xterm.js, logs</text>
  </g>

  <!-- App / UI layer on the right -->
  <g filter="url(#shadow)">
    <rect x="1000" y="340" rx="14" ry="14" width="260" height="370" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="1020" y="375" class="label">Sandpack / UI layer</text>
    <rect x="1020" y="400" rx="10" ry="10" width="220" height="70" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="1040" y="437" class="mono">Monaco editor</text>

    <rect x="1020" y="480" rx="10" ry="10" width="220" height="70" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="1040" y="517" class="mono">Preview iframe</text>

    <rect x="1020" y="560" rx="10" ry="10" width="220" height="70" fill="#F3F4F6" stroke="#E5E7EB"/>
    <text x="1040" y="597" class="mono">Terminal (xterm.js)</text>
  </g>

  <!-- Arrows -->
  <g stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowhead)">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
              refX="10" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#9CA3AF" />
      </marker>
    </defs>
    <line x1="980" y1="425" x2="840" y2="425"/>
    <line x1="980" y1="505" x2="840" y2="505"/>
    <line x1="980" y1="585" x2="840" y2="585"/>
  </g>

  <!-- Captions -->
  <text x="70" y="840" class="cap">Illustration: Browser hosts a WASM sandbox; inside it, a WebContainer runs Node.js (npm, Vite, FS, network). Sandpack/UI consumes that runtime to provide editor, terminal, and preview.</text>
</svg>
